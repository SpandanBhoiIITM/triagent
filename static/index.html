<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070B14; --panel:rgba(19,26,42,.72); --panel-line:rgba(94,118,169,.22);
    --ink:#E6ECF7; --muted:#8B98B4;
    --cyan:#38E1FF; --violet:#9D7BFF;
    --ok:#3DE8A0; --warn:#FFC24B; --bad:#FF6B7A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;
    background-image:
      radial-gradient(ellipse 900px 500px at 70% -10%, rgba(157,123,255,.13), transparent),
      radial-gradient(ellipse 700px 420px at 10% 0%, rgba(56,225,255,.10), transparent),
      linear-gradient(rgba(94,118,169,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,118,169,.05) 1px, transparent 1px);
    background-size:auto,auto,44px 44px,44px 44px;
  }
  .wrap{max-width:900px;margin:0 auto;padding:36px 20px 90px}

  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:30px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:#070B14;font-size:17px}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em}
  h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .status{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
    display:flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--panel-line);
    border-radius:99px;background:var(--panel)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.up{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.down{background:var(--bad);box-shadow:0 0 8px var(--bad)}

  .tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--panel-line);border-radius:9px;
    font:inherit;font-weight:500;font-size:14px;color:var(--muted);
    padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s}
  .tab:hover{color:var(--ink);border-color:rgba(94,118,169,.45)}
  .tab.active{color:#070B14;background:linear-gradient(90deg,var(--cyan),#5FD8FF);
    border-color:transparent;font-weight:600}
  .tab .count{font-family:'JetBrains Mono';font-size:11px;background:rgba(255,107,122,.18);
    color:var(--bad);border-radius:99px;padding:0 7px;line-height:1.7}
  .tab.active .count{background:rgba(7,11,20,.25);color:#070B14}
  .tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--cyan);outline-offset:2px}

  .panel{display:none}.panel.active{display:block}
  .card{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;
    padding:24px;backdrop-filter:blur(8px)}

  label{display:block;font-weight:500;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  input[type=text],textarea,select{width:100%;border:1px solid var(--panel-line);border-radius:9px;
    padding:11px 13px;font:inherit;background:rgba(7,11,20,.55);color:var(--ink);margin-bottom:16px}
  input::placeholder,textarea::placeholder{color:#54617D}
  textarea{min-height:96px;resize:vertical}
  select option{background:#131A2A}
  button.primary{background:linear-gradient(90deg,var(--cyan),var(--violet));color:#070B14;
    border:none;border-radius:9px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
  button.primary:hover{filter:brightness(1.12)}
  button.primary:disabled{opacity:.5;cursor:default}
  button.ghost{background:none;border:1px solid var(--panel-line);border-radius:9px;
    padding:10px 16px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
  button.ghost:hover{border-color:var(--cyan);color:var(--cyan)}
  button.resolve{background:rgba(61,232,160,.12);border:1px solid rgba(61,232,160,.4);
    color:var(--ok);border-radius:8px;padding:6px 14px;font:inherit;font-size:13px;
    font-weight:500;cursor:pointer}
  button.resolve:hover{background:rgba(61,232,160,.22)}

  .result{margin-top:18px;padding:14px 16px;border-radius:9px;
    background:rgba(56,225,255,.08);border:1px solid rgba(56,225,255,.3);display:none}
  .result.error{background:rgba(255,107,122,.08);border-color:rgba(255,107,122,.35)}
  .result .note{font-size:13px;color:var(--muted);margin-top:4px}

  .badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11.5px;
    font-weight:500;padding:2px 10px;border-radius:99px;line-height:1.7;border:1px solid}
  .b-billing{background:rgba(255,194,75,.1);color:var(--warn);border-color:rgba(255,194,75,.35)}
  .b-bug{background:rgba(255,107,122,.1);color:var(--bad);border-color:rgba(255,107,122,.35)}
  .b-account{background:rgba(157,123,255,.12);color:var(--violet);border-color:rgba(157,123,255,.4)}
  .b-howto{background:rgba(61,232,160,.1);color:var(--ok);border-color:rgba(61,232,160,.35)}
  .b-feature{background:rgba(56,225,255,.1);color:var(--cyan);border-color:rgba(56,225,255,.35)}
  .b-plain{background:rgba(139,152,180,.1);color:var(--muted);border-color:rgba(139,152,180,.3)}
  .st{font-family:'JetBrains Mono';font-size:11.5px;padding:2px 10px;border-radius:99px;line-height:1.7}
  .st-open{color:var(--muted);background:rgba(139,152,180,.12)}
  .st-needs_review{color:var(--warn);background:rgba(255,194,75,.12)}
  .st-resolved{color:var(--ok);background:rgba(61,232,160,.12)}
  .sent{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .sent i{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--muted)}
  .s-negative i{background:var(--bad);box-shadow:0 0 6px var(--bad)}
  .s-positive i{background:var(--ok)}

  .toolbar{display:flex;gap:10px;align-items:end;margin-bottom:16px;flex-wrap:wrap}
  .toolbar > div{flex:1;min-width:150px}
  .toolbar input,.toolbar select{margin-bottom:0}
  .source-note{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
    width:100%;margin-top:8px}
  .source-note b{color:var(--cyan);font-weight:500}

  .ticket{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;
    padding:15px 17px;margin-bottom:10px}
  .ticket .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
  .ticket .id{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .ticket .subj{font-weight:600;flex:1;min-width:120px}
  .ticket .body{color:var(--muted);font-size:14px}
  .ticket.review{border-color:rgba(255,194,75,.4)}
  .review-why{font-family:'JetBrains Mono';font-size:11.5px;color:var(--warn);margin-top:8px}

  .pipeline{display:flex;align-items:center;margin:24px 0 18px}
  .stage{flex:1;text-align:center}
  .stage .node{width:38px;height:38px;border-radius:50%;border:2px solid var(--panel-line);
    background:rgba(7,11,20,.6);margin:0 auto 7px;display:flex;align-items:center;
    justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;
    color:var(--muted);transition:all .3s}
  .stage .name{font-size:12px;font-weight:500;color:var(--muted)}
  .stage.active .node{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(56,225,255,.5)}
  .stage.done .node{border-color:var(--ok);background:rgba(61,232,160,.15);color:var(--ok)}
  .stage.active .name,.stage.done .name{color:var(--ink)}
  .connector{height:2px;background:var(--panel-line);flex:0 0 42px;margin-bottom:22px}
  @media (prefers-reduced-motion:no-preference){
    .stage.active .node{animation:pulse 1.1s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(56,225,255,.3)}50%{box-shadow:0 0 20px rgba(56,225,255,.7)}}
  }

  .jobline{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:4px}
  .report{background:rgba(4,7,14,.85);border:1px solid var(--panel-line);border-radius:12px;
    padding:20px;font-family:'JetBrains Mono',monospace;font-size:13px;white-space:pre-wrap;
    line-height:1.75;display:none;margin-top:14px;color:#C7D3E8}
  .report .hdr{color:var(--cyan);border-bottom:1px solid var(--panel-line);
    padding-bottom:9px;margin-bottom:13px;font-size:12px}
  .empty{color:var(--muted);font-size:14px;padding:28px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">Ti</div>
      <h1>Ticket <em>Intelligence</em></h1>
    </div>
    <div class="status"><span class="dot" id="apidot"></span><span id="apitext">connecting</span></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-panel="submit" role="tab">Submit ticket</button>
    <button class="tab" data-panel="browse" role="tab">Tickets</button>
    <button class="tab" data-panel="review" role="tab">Review queue <span class="count" id="reviewCount" style="display:none">0</span></button>
    <button class="tab" data-panel="analyze" role="tab">Agent analysis</button>
  </nav>

  <!-- SUBMIT -->
  <section class="panel active" id="submit">
    <div class="card">
      <label for="subj">Subject</label>
      <input type="text" id="subj" placeholder="Charged twice for my subscription">
      <label for="body">Description</label>
      <textarea id="body" placeholder="Describe the issue the way a customer would..."></textarea>
      <button class="primary" onclick="submitTicket()">Create ticket</button>
      <div class="result" id="submitResult"></div>
    </div>
  </section>

  <!-- BROWSE -->
  <section class="panel" id="browse">
    <div class="toolbar">
      <div style="flex:2">
        <label for="searchBox">Search</label>
        <input type="text" id="searchBox" placeholder="refund, crash, password...">
      </div>
      <div>
        <label for="catFilter">Category</label>
        <select id="catFilter">
          <option value="">All</option>
          <option>billing</option><option>bug</option><option>account</option>
          <option>howto</option><option>feature</option>
        </select>
      </div>
      <button class="ghost" onclick="searchTickets()">Search</button>
      <button class="ghost" onclick="loadTickets()">Load all</button>
      <span class="source-note" id="sourceNote"></span>
    </div>
    <div id="ticketList"><p class="empty">Search for tickets or load all.</p></div>
  </section>

  <!-- REVIEW QUEUE -->
  <section class="panel" id="review">
    <div class="toolbar">
      <div><label>Human-in-the-loop</label>
        <div style="color:var(--muted);font-size:13.5px">Negative tickets and neutral billing tickets wait here for a human decision before automation continues.</div>
      </div>
      <button class="ghost" onclick="loadReview()">Refresh</button>
    </div>
    <div id="reviewList"><p class="empty">Loading review queue...</p></div>
  </section>

  <!-- ANALYZE -->
  <section class="panel" id="analyze">
    <div class="card">
      <label for="query">Question for the agents</label>
      <input type="text" id="query" value="What are the most common billing problems?">
      <button class="primary" id="runBtn" onclick="runAnalysis()">Run agent analysis</button>

      <div class="pipeline" id="pipeline" style="display:none">
        <div class="stage" id="st0"><div class="node">1</div><div class="name">Queued</div></div>
        <div class="connector"></div>
        <div class="stage" id="st1"><div class="node">2</div><div class="name">Retriever</div></div>
        <div class="connector"></div>
        <div class="stage" id="st2"><div class="node">3</div><div class="name">Analyst</div></div>
        <div class="connector"></div>
        <div class="stage" id="st3"><div class="node">4</div><div class="name">Critic</div></div>
      </div>
      <div class="jobline" id="jobline"></div>
      <div class="report" id="report"></div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);

/* tabs */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $(t.dataset.panel).classList.add('active');
  if(t.dataset.panel === 'review') loadReview();
}));

/* health + review badge */
fetch('/health').then(r => r.json()).then(() => {
  $('apidot').classList.add('up'); $('apitext').textContent = 'api online';
}).catch(() => {
  $('apidot').classList.add('down'); $('apitext').textContent = 'api offline';
});
function refreshReviewCount(){
  fetch('/review').then(r => r.json()).then(d => {
    const c = $('reviewCount');
    if(d.tickets.length){ c.style.display = 'inline'; c.textContent = d.tickets.length; }
    else c.style.display = 'none';
  }).catch(() => {});
}
refreshReviewCount();

function esc(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

/* submit */
function submitTicket(){
  const subject = $('subj').value.trim(), body = $('body').value.trim();
  const box = $('submitResult');
  if(!subject || !body){
    box.className = 'result error'; box.style.display = 'block';
    box.textContent = 'Both subject and description are needed to classify the ticket.';
    return;
  }
  fetch('/tickets', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({subject, body})})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    box.className = 'result'; box.style.display = 'block';
    let html = `Ticket <b>#${d.id}</b> created &nbsp;
      <span class="badge b-${d.category}">${d.category}</span> &nbsp;
      <span class="sent s-${d.sentiment}"><i></i>${d.sentiment}</span> &nbsp;
      <span class="st st-${d.status}">${d.status.replace('_',' ')}</span>`;
    if(d.status === 'needs_review')
      html += `<div class="note">Routed to the review queue — a human decides before automation continues.</div>`;
    box.innerHTML = html;
    $('subj').value = ''; $('body').value = '';
    refreshReviewCount();
  })
  .catch(e => {
    box.className = 'result error'; box.style.display = 'block';
    box.textContent = e.message === '429'
      ? 'Rate limit reached — wait a minute before submitting more tickets.'
      : 'The ticket could not be created. Check the API terminal for errors.';
  });
}

/* tickets rendering */
function ticketCard(t, withResolve){
  const resolveBtn = (withResolve && t.status === 'needs_review')
    ? `<button class="resolve" onclick="resolveTicket(${t.id})">Mark resolved</button>` : '';
  const why = withResolve
    ? `<div class="review-why">flagged: ${t.sentiment === 'negative' ? 'negative sentiment' : 'neutral billing (money-risk rule)'}</div>` : '';
  return `
    <div class="ticket ${withResolve ? 'review' : ''}" id="tk${t.id}">
      <div class="row">
        <span class="id">#${t.id}</span>
        <span class="subj">${esc(t.subject)}</span>
        <span class="badge b-${t.category || 'plain'}">${t.category || '—'}</span>
        <span class="sent s-${t.sentiment || 'neutral'}"><i></i>${t.sentiment || '—'}</span>
        <span class="st st-${t.status || 'open'}">${(t.status || 'open').replace('_',' ')}</span>
        ${resolveBtn}
      </div>
      <div class="body">${esc(t.body)}</div>
      ${why}
    </div>`;
}
function renderList(el, tickets, withResolve, emptyMsg){
  el.innerHTML = tickets.length
    ? tickets.map(t => ticketCard(t, withResolve)).join('')
    : `<p class="empty">${emptyMsg}</p>`;
}

function loadTickets(){
  const cat = $('catFilter').value;
  const url = cat ? `/tickets?category=${cat}` : '/tickets';
  fetch(url).then(r => r.json()).then(d => {
    $('sourceNote').innerHTML = `served from <b>${d.source}</b>`;
    renderList($('ticketList'), d.tickets, false, 'No tickets in this category yet.');
  });
}
function searchTickets(){
  const q = $('searchBox').value.trim();
  if(!q){ loadTickets(); return; }
  fetch(`/search?q=${encodeURIComponent(q)}`).then(r => r.json()).then(d => {
    $('sourceNote').innerHTML = `search results for <b>${esc(q)}</b> — ${d.tickets.length} found`;
    renderList($('ticketList'), d.tickets, false, 'No tickets match that search.');
  });
}
$('searchBox').addEventListener('keydown', e => { if(e.key === 'Enter') searchTickets(); });

/* review queue */
function loadReview(){
  fetch('/review').then(r => r.json()).then(d => {
    renderList($('reviewList'), d.tickets, true,
      'Review queue is clear — no tickets waiting on a human.');
    refreshReviewCount();
  });
}
function resolveTicket(id){
  fetch(`/tickets/${id}/resolve`, {method:'POST'})
  .then(r => r.json())
  .then(() => {
    const el = $('tk' + id);
    if(el){ el.style.opacity = '0'; setTimeout(() => { el.remove(); loadReview(); }, 300); }
    else loadReview();
  });
}

/* analysis pipeline */
let pollTimer = null;
function setStages(upTo, running){
  for(let i = 0; i < 4; i++){
    const st = $('st' + i);
    st.classList.remove('active','done');
    if(i < upTo) st.classList.add('done');
    else if(i === upTo && running) st.classList.add('active');
  }
}
function runAnalysis(){
  const query = $('query').value.trim();
  if(!query) return;
  clearInterval(pollTimer);
  $('runBtn').disabled = true;
  $('report').style.display = 'none';
  $('pipeline').style.display = 'flex';
  setStages(0, true);
  $('jobline').textContent = 'submitting job...';

  fetch('/analyze', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({query})})
  .then(r => r.json())
  .then(d => {
    $('jobline').textContent = `job ${d.job_id} — queued`;
    let ticks = 0;
    pollTimer = setInterval(() => {
      fetch(`/jobs/${d.job_id}`).then(r => r.json()).then(s => {
        if(s.status === 'queued') setStages(0, true);
        if(s.status === 'running'){
          ticks++;
          setStages(Math.min(1 + Math.floor(ticks / 2), 3), true);
          $('jobline').textContent = `job ${d.job_id} — running (agent pipeline)`;
        }
        if(s.status === 'done'){
          clearInterval(pollTimer);
          setStages(4, false);
          $('jobline').textContent = `job ${d.job_id} — done`;
          const rep = $('report');
          rep.style.display = 'block';
          rep.innerHTML = `<div class="hdr">agent report · grounded against ticket ids by critic node</div>` + esc(s.report);
          $('runBtn').disabled = false;
        }
        if(s.status === 'failed'){
          clearInterval(pollTimer);
          $('jobline').textContent = `job ${d.job_id} — failed. Check the worker terminal.`;
          $('runBtn').disabled = false;
        }
      });
    }, 2000);
  })
  .catch(() => {
    $('jobline').textContent = 'The job could not be submitted. Check that the API is running.';
    $('runBtn').disabled = false;
  });
}
</script>
</body>
</html>
